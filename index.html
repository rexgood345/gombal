<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💕 Gombal Bucin Lucu 💕</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating flowers background -->
  <div class="flowers-bg" id="flowersBg"></div>

  <!-- Header -->
  <header>
    <div class="heart-bounce">💖</div>
    <h1>Gombal Bucin Lucu</h1>
    <p class="subtitle">Karena cinta itu lucu, apalagi kalau gombal 🌸</p>
  </header>

  <!-- Main card -->
  <main>
    <div class="card" id="gombalCard">
      <div class="card-flower-top">🌸🌺🌼</div>
      <div class="emoji-big" id="cardEmoji">🥺</div>
      <p class="gombal-text" id="gombalText">
        Klik tombol di bawah untuk dapat gombal spesial untukmu~
      </p>
      <div class="card-flower-bottom">🌼🌺🌸</div>
    </div>

    <div class="btn-group">
      <button class="btn-gombal" onclick="getGombal()">
        🌹 Minta Gombal! 🌹
      </button>
      <button class="btn-share" onclick="shareGombal()">
        💌 Kirim ke Doi
      </button>
    </div>
  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast">💕 Disalin! Kirim ke doi sekarang~</div>

  <!-- Footer -->
  <footer>
    <p>Made with 💖 &nbsp;|&nbsp; <a href="https://pages.github.com" target="_blank">GitHub Pages</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
